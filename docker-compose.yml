version: '3.8'

services:
  web:
    build: .
    ports:
      - "8090:5001"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://db:27017/mydatabase
    command: gunicorn --reload -w 1 -b 0.0.0.0:5001 app:app
    depends_on:
      - db
  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
